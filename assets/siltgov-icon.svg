<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SILTGOV icon">
  <defs>
    <linearGradient id="sg-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1c5bb8"/>
      <stop offset="100%" stop-color="#1347a0"/>
    </linearGradient>
    <linearGradient id="sg-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#34a853"/>
      <stop offset="100%" stop-color="#2d9147"/>
    </linearGradient>
  </defs>

  <!-- Fondo circular -->
  <circle cx="32" cy="32" r="32" fill="url(#sg-bg)"/>

  <!-- Franja de acento inferior (verde gobernación) -->
  <clipPath id="sg-clip">
    <circle cx="32" cy="32" r="32"/>
  </clipPath>
  <rect x="0" y="50" width="64" height="14" fill="url(#sg-accent)" clip-path="url(#sg-clip)"/>

  <!-- Letra S estilizada -->
  <!-- Arco superior de la S -->
  <path d="M22 22 Q22 16 32 16 Q42 16 42 22 Q42 27 32 30 Q22 33 22 38 Q22 44 32 44 Q42 44 42 38"
        fill="none"
        stroke="#ffffff"
        stroke-width="5"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Punto de detalle en la base de la S -->
  <circle cx="32" cy="47" r="1.5" fill="#fbbc05"/>
</svg>
