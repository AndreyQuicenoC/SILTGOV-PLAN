<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SILTGOV - Sistema Integrado de Liquidaciones del Gobierno. Documentacion del proyecto."
    />
    <title>SILTGOV - Sistema Integrado de Liquidaciones</title>
    <link rel="icon" type="image/svg+xml" href="assets/siltgov-icon.svg" />
    <link rel="stylesheet" href="styles/user_stories.css" />
    <link rel="stylesheet" href="styles/index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="header">
      <div class="container">
        <div class="header-content">
          <div class="logo-section">
            <div class="logo-text">
              <h1 class="logo-title" id="page-title"></h1>
              <p class="logo-subtitle" id="page-subtitle"></p>
            </div>
          </div>
          <button id="theme-toggle" class="theme-toggle" aria-label="Cambiar tema">
            <span class="theme-icon">Oscuro</span>
          </button>
        </div>
      </div>
    </header>

    <main class="main">
      <div class="container">
        <section class="welcome-section">
          <h2 class="welcome-title" id="welcome-title"></h2>
          <p class="welcome-description" id="welcome-description"></p>
        </section>
        <section class="navigation-grid" id="navigation-grid">
          <!-- Cards rendered dynamically from INDEX_DATA via index.js -->
        </section>
      </div>
    </main>

    <footer class="footer">
      <div class="container">
        <p id="footer-line1"></p>
        <p id="footer-line2"></p>
      </div>
    </footer>

    <script src="data/index_data.js"></script>
    <script src="scripts/index.js"></script>
  </body>
</html>
