<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Distribucion del equipo por sprints - SILTGOV Sistema Integrado de Liquidaciones"
    />
    <title>Distribucion por Sprints - SILTGOV</title>
    <link rel="stylesheet" href="../styles/user_stories.css" />
    <link rel="stylesheet" href="../styles/team_distribution.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="header">
      <div class="container">
        <div class="header-content">
          <h1 class="logo">
            <span class="logo-icon"></span>
            Distribucion por Sprints
          </h1>
          <div class="project-info">
            <span class="project-name">SILTGOV</span>
          </div>
          <div style="display: flex; gap: 0.5rem; align-items: center">
            <a
              href="../index.html"
              class="back-button"
              aria-label="Volver al inicio"
            >
              <span>&#8592;</span> Inicio
            </a>
            <button
              id="theme-toggle"
              class="theme-toggle"
              aria-label="Cambiar tema"
            >
              <span class="theme-icon">Oscuro</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <main class="main">
      <div class="container">

        <!-- Resumen del proyecto -->
        <section class="info-section">
          <p class="info-description" id="team-description"></p>
        </section>

        <!-- Error State -->
        <div id="error-state" class="error-state" hidden role="alert">
          <h2>Error al cargar informacion</h2>
          <p id="error-message"></p>
        </div>

        <!-- Metricas generales -->
        <section id="metrics-section" hidden>
          <div id="metrics-container"></div>
        </section>

        <!-- Contadores de tareas por desarrollador (proyecto completo) -->
        <section id="global-task-counters" hidden aria-label="Distribucion de tareas por desarrollador"></section>

        <!-- Distribucion por sprints -->
        <section class="sprints-section">
          <h2 class="section-title">Historias y Tareas por Sprint</h2>
          <p class="section-description" id="sprints-subtitle">
            Planificacion de 12 semanas - cada historia con sus tareas y asignaciones
          </p>
          <div id="sprints-container" class="sprints-container">
            <!-- Se carga dinamicamente -->
          </div>
        </section>

      </div>
    </main>

    <footer class="footer">
      <div class="container">
        <p>&copy; 2025 SILTGOV - Sistema Integrado de Liquidaciones del Gobierno</p>
        <p>Equipo ClustLayer - metodologia agil Scrum</p>
      </div>
    </footer>

    <script src="../data/team_data.js"></script>
    <script src="../scripts/team_distribution.js"></script>
  </body>
</html>
